name: Build MYRA OS ISO

on:
  push:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm archiso base-devel

      - name: Build MYRA OS Image
        run: |
          mkarchiso -v -w /tmp/work_dir -o /tmp/out_dir configs/myra/

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: myra-os-iso
          path: /tmp/out_dir/*.iso
